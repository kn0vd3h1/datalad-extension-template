[metadata]
name = datalad_helloworld
version = 9.9.9
url = https://github.com/datalad/datalad-extension-template
author = The DataLad Team and Contributors
author_email = team@datalad.org
description = demo DataLad extension package
long_description = file:README.md
long_description_content_type = text/markdown; charset=UTF-8
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering

[options]
python_requires = >=3.8
install_requires =
    datalad >= 0.16.0
packages = find_namespace:
include_package_data = True

[options.packages.find]
include = datalad_helloworld*

[options.extras_require]
# this matches the name used by core (hub)
devel =
    pytest
    pytest-cov
    coverage
    sphinx
    sphinx_rtd_theme
    sphinx_copybutton

[options.entry_points]
# 'datalad.extensions' is THE entrypoint inspected by the datalad core library
# to find and register extensions.
# the value is a COMMAND-SUITE-NAME = MODULE:VARIABLE-WITH-SPEC
datalad.extensions =
    helloworld = datalad_helloworld:command_suite

[versioneer]
# See the docstring in versioneer.py for instructions. Note that you must
# re-run 'versioneer.py setup' after changing this section, and commit the
# resulting files.
VCS = git
style = pep440
versionfile_source = datalad_helloworld/_version.py
versionfile_build = datalad_helloworld/_version.py
tag_prefix =
parentdir_prefix =

[coverage:report]
show_missing = True
omit =
    # versioneer code
    datalad_helloworld/_version.py
